name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.8
      - name: Install dependencies
        run: |
          uv pip install --system torch torchvision --default-index https://download.pytorch.org/whl/cpu
          uv pip install --system -r requirements-dev.txt
          uv pip check --system
      - name: Check code style and shell syntax
        run: |
          ruff check --select E4,E7,E9,F,I inference.py cli_pipeline.py api.py test_api.py tests
          ruff format --check inference.py cli_pipeline.py api.py test_api.py tests
          bash -n docker-build.sh docker-run.sh
      - name: API, client and Docker script regression tests
        run: python -m pytest -q
      - name: Smoke test (random weights, no download)
        run: |
          python - <<'EOF'
          import torch
          from megaloc_model import MegaLoc

          model = MegaLoc().eval()
          with torch.inference_mode():
              out = model(torch.randn(2, 3, 322, 406))
          assert out.shape == (2, 8448), out.shape
          assert torch.allclose(out.norm(dim=1), torch.ones(2), atol=1e-5)

          import hubconf
          assert callable(hubconf.get_trained_model)
          print("OK")
          EOF
